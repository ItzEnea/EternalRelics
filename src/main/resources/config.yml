# Faction Configuration
factions:
  enabled: true
  
  # Faction colors
  colors:
    HUMAN: "§f"
    CULT: "§c"
    VOID: "§5"
  
  # Faction chat prefix
  chat-prefix:
    HUMAN: "§f[HUMAN]"
    CULT: "§c[CULT]"
    VOID: "§5[VOID]"
  
  # Faction passives
  passives:
    HUMAN:
      regeneration-level: 2
      resistance-level: 1
    CULT:
      speed-level: 1
      strength-level: 1
    VOID:
      invisibility: false
      nightvision: true
      strength-level: 2

# Relic of Convergence
relic:
  enabled: true
  model-data: 9001
  
  # Defense timer in seconds
  defense-timer: 1800  # 30 minutes
  
  # Relic stats
  health: 200.0
  
  # Victory broadcasts
  victory-messages:
    HUMAN: "§f[§6⚔§f] The Humans have seized the Relic of Convergence!"
    CULT: "§c[§6⚔§c] The Cult has corrupted the Relic of Convergence!"
    VOID: "§5[§6⚔§5] The Void has consumed the Relic of Convergence!"

# Particle and VFX Settings
particles:
  enabled: true
  
  # Reduce particle count on high player servers
  reduction-factor: 1.0  # 1.0 = normal, 0.5 = half particles
  
  # Held item particles
  held-item-particles:
    enabled: true
    update-rate: 2  # ticks

# Sound Settings
sounds:
  enabled: true
  volume: 1.0
  pitch: 1.0
  
  # Sound sources
  altar-craft-start: "entity.beacon.activate"
  altar-craft-complete: "entity.player.levelup"
  altar-craft-fail: "entity.wither.spawn"
  
  # Ability sounds
  ability-activate: "entity.player.attack.crit"
  ability-cooldown: "block.note_block.bass"

# Database Configuration
database:
  type: "json"  # "json" or "sqlite"
  
  # JSON storage settings
  json:
    directory: "data"
    auto-save-interval: 6000  # ticks (5 minutes)
  
  # SQLite settings (for future use)
  sqlite:
    filename: "eternalrelics.db"
    connection-pool-size: 5

# Performance Settings
performance:
  # Maximum players before reducing particles
  high-player-threshold: 80
  
  # Entity scan optimization
  entity-scan-interval: 40  # ticks
  
  # Async task processing
  async-enabled: true
  thread-pool-size: 4

# Message Settings
messages:
  prefix: "§6[⚔ EternalRelics]"
  
  # Item-related messages
  item-already-exists: "§cThis relic already exists on the server."
  item-created: "§a§f{item}§a has been crafted!"
  
  # Altar messages
  altar-placed: "§aAltar placed successfully."
  altar-removed: "§cAltar removed."
  altar-status: "§6Currently: {status}"
  
  # Event messages
  event-started: "§6Event started: {event}"
  event-ended: "§cEvent ended: {event}"
  
  # Faction messages
  faction-join: "§7You have joined the §f{faction}§7 faction."
  faction-leave: "§7You have left the §f{faction}§7 faction."

# Debug Settings
debug:
  enabled: false
  verbose: false
  log-item-events: false
  log-ability-triggers: false
