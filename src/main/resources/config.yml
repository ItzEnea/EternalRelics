# ========================================
# EternalRelics Configuration
# ========================================

# Crafting Window Settings
crafting:
  # Time window for legendary crafting (24-hour format, CET)
  enabled: true
  start-hour: 16    # 16:00 CET (4 PM)
  end-hour: 19      # 19:00 CET (7 PM)
  timezone: "Europe/Paris"  # CET timezone
  
  # Broadcast messages
  broadcasts:
    enabled: true
    times:
      - 15:50
      - 15:55
      - 16:00
      - 18:50
      - 18:55
      - 19:00
    messages:
      opening: "§6[⚔] §fThe legendary altars awaken! Crafting is now possible."
      closing: "§6[⚔] §fThe altars grow dormant once more..."
      dormant: "§7The altar is dormant. Legendary crafting is only possible between 16:00 and 19:00 CET."

# Fragment Event Settings
events:
  # Fragment spawning configuration
  fragments:
    enabled: true
    # Drop chance per source (0.0 - 1.0)
    drop-chance: 0.15
    
    # Maximum concurrent fragments
    spawn-caps:
      "Fragment of the Sun": 1
      "Fragment of the Heart": 1
      "Fragment of Time": 1
      "Fragment of Gold": 1
    
    # Fragment sources
    sources:
      ominous-vaults: true
      wardens: true
      withers: true
      vaults: true
    
    # Fragment holder tracking broadcast interval (ticks)
    # 50 seconds = 1000 ticks
    tracking-interval: 1000
    tracking-message: "§6[⚔] §f{player} §7holds §f{fragment} §7at §6{x} {y} {z}"
    
    # Broadcast format for holder tracking
    tracking-prefix: "§6[Fragment Tracker]"

# Armor Configuration
armor:
  # Sun Crown (Helmet)
  sun-crown:
    enabled: true
    model-data: 1001
    cooldown-seconds: 5
    movement-speed: 0.3
    damage: false
  
  # Heart of Avaritia (Chestplate)
  heart-avaritia:
    enabled: true
    model-data: 1002
    cooldown-seconds: 10
    heal-amount: 4.0  # half hearts
    trigger-health-percentage: 0.5  # Trigger at 50% health
  
  # Golden Time Steppers (Leggings)
  time-steppers:
    enabled: true
    model-data: 1003
    cooldown-seconds: 8
    double-jump-height: 1.2
    velocity-multiplier: 1.5
  
  # Footsteps of Midas (Boots)
  midas-boots:
    enabled: true
    model-data: 1004
    cooldown-seconds: 15
    explosion-strength: 2.0
    true-damage: 20.0

